spring.application.name=customer-management-system

# PostgreSQL is now the main runtime database configuration.
# This keeps the application aligned with the current customer-management module setup.
spring.datasource.url=jdbc:postgresql://localhost:5432/customerdb
spring.datasource.username=postgres
spring.datasource.password=secret
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Local shared-secret JWT settings.
# In enterprise deployment, replace this with OAuth2/OpenID Connect
# configuration from Okta, Azure AD, Keycloak, or another identity provider.
security.jwt.secret=${JWT_SECRET:customer-management-system-demo-secret-2026}
security.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:120}
security.jwt.issuer=${JWT_ISSUER:customer-management-system}

# Springdoc / Swagger UI settings for a cleaner local demo experience.
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.display-request-duration=true

# Basic enterprise-style observability for local demos.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true

info.app.name=Customer Management System
info.app.version=1.0.0-demo
info.app.description=Backend application with JWT authentication and customer management APIs.
info.app.java.version=17
info.app.documentation=Swagger UI available at /swagger-ui.html

# Keep logs structured and easy to scan without being too noisy.
logging.level.root=INFO
logging.level.com.example.employeetaskmanagement=INFO
logging.level.com.example.customer=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} level=%-5level app=${spring.application.name} logger=%logger{36} message="%msg"%n
