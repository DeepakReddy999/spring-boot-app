spring.application.name=customer-management-system-test

# Tests use H2 so the Maven build stays self-contained and does not need a running PostgreSQL instance.
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.h2.console.enabled=false

security.jwt.secret=test-jwt-secret-key-for-build-validation-2026
security.jwt.expiration-minutes=120
security.jwt.issuer=customer-management-system-test

springdoc.swagger-ui.path=/swagger-ui.html
management.endpoints.web.exposure.include=health,info
